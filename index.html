<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plantonista</title>
<meta name="theme-color" content="#F7F5F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Plantonista">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --roxo:#6B2BD6;--roxo-esc:#4E1BA3;--roxo-cl:#EFE8FC;--roxo-md:#D9CCF6;
  --papel:#F7F5F0;--branco:#FFFFFF;--tinta:#17141F;--cinza:#5B5670;--cinza2:#8C8799;
  --linha:#E3DED2;--linha2:#ECE8DF;
  --ambar:#9A5B00;--ambar-cl:#FFF1D6;--verde:#1F7A4D;--verde-cl:#E2F2E8;--verm:#B42318;--verm-cl:#FDECEA;
  --mono:'JetBrains Mono',ui-monospace,monospace;--cond:Inter,system-ui,sans-serif;--serif:'Playfair Display',Georgia,'Times New Roman',serif;--mao:'Satisfy',cursive;
  --sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--papel);color:var(--tinta);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.2px}
.hide{display:none!important}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ---------- Estrutura ---------- */
#app{max-width:760px;margin:0 auto;padding:calc(var(--st) + 14px) 16px calc(var(--sb) + 96px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 0 18px}
.titulo{font-family:var(--mao);color:var(--roxo);font-size:46px;line-height:1;font-weight:400}
.titulo small{font-family:var(--mono);color:var(--cinza);font-size:14px;margin-left:8px;letter-spacing:0}
.top-acts{display:flex;gap:6px;align-items:center}
.ib{width:38px;height:38px;border:1px solid var(--linha);background:var(--branco);border-radius:4px;display:inline-flex;align-items:center;justify-content:center}
.ib:active{background:var(--roxo-cl)}
.h{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:0;margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.h .sub{font-family:Inter;text-transform:none;letter-spacing:0;font-weight:400;font-size:13px;color:var(--cinza)}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:4px;padding:14px 16px}
.card+.card{margin-top:10px}
.muted{color:var(--cinza);font-size:13px}
.vazio{border:1px dashed var(--linha);border-radius:4px;padding:18px;text-align:center;color:var(--cinza);font-size:14px;background:transparent}

/* ---------- Navegação ---------- */
nav.bot{position:fixed;left:0;right:0;bottom:0;background:var(--branco);border-top:1px solid var(--linha);padding:6px 8px calc(var(--sb) + 6px);display:flex;justify-content:space-around;align-items:center;z-index:30}
nav.bot button{display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--cond);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--cinza2);padding:4px 8px;min-width:62px}
nav.bot button.on{color:var(--roxo)}
nav.bot .mais{width:52px;height:52px;border-radius:4px;background:var(--roxo);color:#fff;justify-content:center;margin-top:-22px;min-width:0;padding:0}
nav.bot .mais svg{width:26px;height:26px;stroke-width:2.2}

/* ---------- Botões / campos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:4px;font-family:var(--cond);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.5px;border:1px solid var(--linha);background:var(--branco)}
.btn.p{background:var(--roxo);border-color:var(--roxo);color:#fff}
.btn.p:active{background:var(--roxo-esc)}
.btn.g{border-color:transparent;background:transparent;color:var(--roxo)}
.btn.d{color:var(--verm);border-color:#F2C9C4}
.btn.sm{height:34px;font-size:12px;padding:0 12px}
.btn.w{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-family:var(--cond);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--cinza);margin-bottom:4px}
.in{width:100%;height:44px;border:1px solid var(--linha);border-radius:4px;background:var(--branco);padding:0 12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
textarea.in{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
select.in{background-image:linear-gradient(45deg,transparent 50%,var(--cinza) 50%),linear-gradient(135deg,var(--cinza) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
.in:focus{border-color:var(--roxo);box-shadow:0 0 0 3px var(--roxo-cl)}
input[type=date].in,input[type=time].in,input[type=month].in{font-family:var(--mono);font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--linha2)}
.sw:first-child{border-top:0}
.sw .t{font-weight:500}
.sw .t .muted{font-weight:400;display:block}
.tg{position:relative;width:46px;height:28px;flex-shrink:0}
.tg input{opacity:0;width:0;height:0;position:absolute}
.tg i{position:absolute;inset:0;background:var(--linha);border-radius:14px;transition:.2s}
.tg i:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.tg input:checked+i{background:var(--roxo)}
.tg input:checked+i:before{transform:translateX(18px)}
.seg{display:flex;border:1px solid var(--linha);border-radius:4px;background:var(--branco);overflow:hidden}
.seg button{flex:1;height:36px;font-family:var(--cond);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--cinza);border-left:1px solid var(--linha);padding:0 8px;white-space:nowrap}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--roxo);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:32px;padding:0 12px;border:1px solid var(--linha);border-radius:16px;background:var(--branco);font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--roxo-cl);border-color:var(--roxo);color:var(--roxo-esc);font-weight:500}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.cores{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cor{width:34px;height:34px;border-radius:4px;background:var(--c);border:2px solid transparent;position:relative}
.cor.on{box-shadow:0 0 0 2px var(--branco),0 0 0 4px var(--tinta)}
.cor input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.cor.custom{background:conic-gradient(#e11d48,#f59e0b,#16a34a,#0ea5e9,#6B2BD6,#e11d48)}

/* ---------- Agenda ---------- */
.mesnav{display:flex;align-items:center;gap:6px}
.filtros{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.cal{background:var(--branco);border:1px solid var(--linha);border-radius:4px;overflow:hidden}
.cal-h{display:grid;grid-template-columns:repeat(7,1fr);border-bottom:1px solid var(--linha)}
.cal-h div{font-family:var(--cond);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--cinza);text-align:center;padding:7px 0}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr)}
.dia{min-height:76px;border-right:1px solid var(--linha2);border-bottom:1px solid var(--linha2);padding:4px 3px;text-align:left;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.dia:nth-child(7n){border-right:0}
.dia .n{font-family:var(--mono);font-size:12.5px;font-weight:500;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;margin-left:1px}
.dia.fora .n{color:var(--cinza2);opacity:.55}
.dia.fora .bar{opacity:.45}
.dia.hoje .n{background:var(--roxo);color:#fff}
.dia.sel{background:var(--roxo-cl)}
.dia.ferias{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(107,43,214,.08) 6px 12px)}
.dia .bar{display:block;font-style:normal;background:var(--c);color:#fff;font-family:var(--cond);font-weight:600;font-size:9.5px;letter-spacing:0;line-height:15px;height:15px;padding:0 3px;border-radius:2px;white-space:nowrap;overflow:hidden;text-overflow:clip}
.dia .bar.cont{background:transparent;color:var(--c);border:1px dashed var(--c);line-height:13px}
.dia .bar.atr{box-shadow:inset 3px 0 0 #F5A524}
.dia .mais{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--cinza)}
.dia .fx{position:absolute;right:3px;top:5px;width:6px;height:6px;border-radius:50%;background:var(--roxo-md)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--linha);border-radius:4px;background:var(--branco);margin-top:10px}
.stats div{padding:10px 8px;border-left:1px solid var(--linha2);text-align:center}
.stats div:first-child{border-left:0}
.stats b{display:block;font-family:var(--mono);font-size:17px;font-weight:600}
.stats span{font-family:var(--cond);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--cinza)}
.diatit{font-family:var(--mao);color:var(--roxo);font-size:30px;line-height:1.1;margin:22px 0 10px}
.diatit small{font-family:Inter;color:var(--cinza);font-size:13px;margin-left:6px}
.qadd{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.qadd::-webkit-scrollbar{display:none}

/* ---------- Cartão de plantão ---------- */
.pc{display:flex;align-items:stretch;background:var(--branco);border:1px solid var(--linha);border-radius:4px;overflow:hidden}
.pc+.pc{margin-top:8px}
.pc-b{width:5px;background:var(--c);flex-shrink:0}
.pc-m{flex:1;padding:10px 12px;text-align:left;min-width:0}
.pc-t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-t .star{color:#E0A000;margin-right:3px}
.pc-s{font-size:13px;color:var(--cinza)}
.pc-n{font-size:13px;color:var(--cinza);font-style:italic;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-r{padding:10px 4px 10px 0;text-align:right;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:4px}
.pc-r .val{font-size:14px;font-weight:600}
.tagp{display:inline-block;font-family:var(--cond);font-size:10.5px;font-weight:600;letter-spacing:.3px;color:var(--c,var(--roxo));border:1px solid var(--c,var(--roxo));border-radius:3px;padding:0 5px;line-height:16px;vertical-align:2px}
.pc-ed{width:38px;border-left:1px solid var(--linha2);display:flex;align-items:center;justify-content:center;color:var(--cinza2)}
.pc-ed svg{width:17px;height:17px}
.li.grp{width:100%;text-align:left}
.subgrp{padding-left:14px;border-left:2px solid var(--linha2);margin:2px 0 6px 14px}
.dia{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dia .bar[data-drag]{cursor:grab}
.dia .bar.arrastando{opacity:.3}
.dia.alvo{background:var(--roxo-cl);box-shadow:inset 0 0 0 2px var(--roxo)}
.bar.ghost{position:fixed;z-index:80;pointer-events:none;background:var(--c);color:#fff;font:600 11px/22px Inter,sans-serif;padding:0 8px;border-radius:3px;box-shadow:0 8px 20px rgba(23,20,31,.3);white-space:nowrap;font-style:normal}
.pc-pay{width:48px;border-left:1px solid var(--linha2);display:flex;align-items:center;justify-content:center;color:var(--cinza2)}
.pc-pay.on{color:var(--verde);background:var(--verde-cl)}
.st{font-family:var(--cond);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:1px 7px;border-radius:2px;white-space:nowrap}
.st.pago{background:var(--verde-cl);color:var(--verde)}
.st.atrasado{background:var(--ambar-cl);color:var(--ambar)}
.st.aberto{background:var(--roxo-cl);color:var(--roxo-esc)}
.st.nota{background:#EEF0F4;color:#3D4556}
.fer{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--roxo-md);background:var(--roxo-cl);border-radius:4px;padding:10px 12px;margin-bottom:8px;color:var(--roxo-esc);font-size:14px}
.dsep{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:0;color:var(--cinza);margin:16px 0 6px;display:flex;justify-content:space-between}
.dsep:first-child{margin-top:0}

/* ---------- Financeiro / relatórios ---------- */
.mets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.met{background:var(--branco);border:1px solid var(--linha);border-radius:4px;padding:12px 14px}
.met span{font-family:var(--serif);font-weight:600;font-size:14.5px;letter-spacing:0;color:var(--cinza);display:block}
.met b{font-family:var(--mono);font-size:20px;font-weight:600;display:block;margin-top:2px;white-space:nowrap}
.met.dest{background:var(--roxo);border-color:var(--roxo);color:#fff}
.met.dest span{color:#E5DAFB}
.met.alerta b{color:var(--ambar)}
.met small{font-size:12px;color:var(--cinza)}
.met.dest small{color:#E5DAFB}
.ln{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linha2)}
.ln:first-child{border-top:0}
.ln .dot{width:10px;height:10px;border-radius:2px;background:var(--c);flex-shrink:0}
.ln .g{flex:1;min-width:0}
.ln .g b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .g span{font-size:13px;color:var(--cinza)}
.ln .v{font-family:var(--mono);font-weight:600;font-size:14px;text-align:right;white-space:nowrap}
.ln .v small{display:block;font-family:Inter;font-weight:400;font-size:12px;color:var(--cinza)}
.loc-h{display:flex;align-items:center;gap:10px;width:100%;text-align:left}
.loc-h .g{flex:1;min-width:0}
.loc-h b{font-weight:600}
.tot{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--tinta);margin-top:6px;padding-top:8px;font-weight:600}
.tot .mono{color:var(--roxo)}
table.tb{width:100%;border-collapse:collapse;font-size:13.5px}
.tb th{font-family:var(--cond);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--cinza);text-align:left;padding:6px 6px;border-bottom:1px solid var(--linha)}
.tb td{padding:8px 6px;border-bottom:1px solid var(--linha2);vertical-align:top}
.tb .r{text-align:right}
.tb td.r{font-family:var(--mono);white-space:nowrap}
.tbw{overflow-x:auto;padding:10px 12px}
.tb td,.tb th{white-space:nowrap}
.tb td.wrap{white-space:normal;min-width:110px}
.chart svg{width:100%;height:auto;display:block}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--cinza);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.relf{display:grid;gap:10px}

/* ---------- Ajustes ---------- */
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--linha2)}
.li:first-child{border-top:0}
.li .g{flex:1;min-width:0;text-align:left}
.li .g b{font-weight:600;display:block}
.li .g span{font-size:13px;color:var(--cinza)}
.li .sq{width:30px;height:30px;border-radius:4px;background:var(--c);flex-shrink:0;color:#fff;font-family:var(--cond);font-weight:700;font-size:10px;display:flex;align-items:center;justify-content:center;letter-spacing:.3px}
.ord{display:flex;flex-direction:column}
.ord button{width:34px;height:22px;display:flex;align-items:center;justify-content:center;color:var(--cinza)}
.ord button:disabled{opacity:.25}
.ord svg{width:16px;height:16px}

/* ---------- Folha (modal) ---------- */
.ov{position:fixed;inset:0;background:rgba(23,20,31,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s}
.sh{background:var(--papel);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:8px 8px 0 0;padding:8px 18px calc(var(--sb) + 18px);animation:up .2s ease-out;-webkit-overflow-scrolling:touch}
.sh .grab{width:40px;height:4px;background:var(--linha);border-radius:2px;margin:4px auto 10px}
.sh-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sh-t h3{font-family:var(--mao);font-weight:400;color:var(--roxo);font-size:32px;line-height:1.1}
@media(min-width:700px){.ov{align-items:center}.sh{border-radius:8px}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 84px);background:var(--tinta);color:#fff;padding:10px 14px;border-radius:4px;font-size:14px;z-index:60;display:flex;gap:14px;align-items:center;max-width:92vw;animation:up .2s}
.toast button{color:#C9B4F5;font-family:var(--cond);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.mini-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mini-cal button{height:36px;border:1px solid var(--linha);border-radius:4px;background:var(--branco);font-family:var(--mono);font-size:13px}
.mini-cal button.on{background:var(--roxo);color:#fff;border-color:var(--roxo)}
.mini-cal span{text-align:center;font-family:var(--cond);font-weight:600;font-size:10.5px;color:var(--cinza)}
.paylist{max-height:260px;overflow-y:auto;border:1px solid var(--linha);border-radius:4px;background:var(--branco);padding:0 12px;margin-bottom:12px}
.paylist label{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--linha2);font-size:14px}
.paylist label:first-child{border-top:0}
.paylist input{width:18px;height:18px;accent-color:var(--roxo)}
.paylist .mono{margin-left:auto}
.dica{background:var(--roxo-cl);border:1px solid var(--roxo-md);color:var(--roxo-esc);border-radius:4px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.err{color:var(--verm);font-size:13.5px;margin:-4px 0 10px}

/* ---------- Login ---------- */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:400px;margin:0 auto}
.login .logo{font-family:var(--mao);color:var(--roxo);font-size:64px;text-align:center;line-height:1.1;transform:rotate(-5deg);margin-bottom:6px}
.login .tag{text-align:center;color:var(--cinza);font-size:14px;margin-bottom:30px}
.login .link{display:block;margin:16px auto 0;color:var(--roxo);font-size:14px;text-decoration:underline}
.boot{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:var(--mao);color:var(--roxo);font-size:52px}

/* ---------- Impressão (PDF) ---------- */
#print{display:none}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff}
  #app,nav.bot,.ov,.toast{display:none!important}
  #print{display:block;color:#17141F;font-size:11.5px}
  #print .pl{font-family:var(--mao);color:var(--roxo);font-size:30px}
  #print h2{font-family:var(--serif);font-weight:600;font-size:16px;margin:16px 0 6px;border-bottom:2px solid #17141F;padding-bottom:3px}
  #print table{width:100%;border-collapse:collapse}

async function putMany(ops) { // ops: [{col, obj}|{col, id, del:true}]

let sheetEl = null;

function confirmar(titulo, texto, opcoes) { // opcoes: [{t, v, cls}]

function renderLogin(modo = 'entrar', erro = '') {

      const cred = await FB.au.createUserWithEmailAndPassword(FB.auth, u + DOMINIO, s);
      try {
        await FB.fs.setDoc(FB.fs.doc(FB.db, 'users', cred.user.uid), { username:u, convite:f.c.value.trim(), criado:Date.now() });
      } catch (err) {
        S.loginErr = err.code === 'permission-denied' ? 'Código de convite inválido. Confira letras maiúsculas e minúsculas.' : 'Não foi possível criar a conta (' + (err.code || err.message) + ').'; S.loginModo = 'criar';
        S.criando = false;
        await cred.user.delete().catch(() => FB.au.signOut(FB.auth));
        if (S.loginErr) renderLogin();
        return;
      }
      S.criando = false;
      entrar(cred.user);
    } catch (err) {
      S.criando = false;
      const c = err.code || '';
      const msg = c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') ? 'Usuário ou senha incorretos.'
        : c.includes('email-already-in-use') ? 'Esse usuário já existe. Escolha outro.'
        : c.includes('weak-password') ? 'A senha precisa ter pelo menos 6 caracteres.'
        : c.includes('too-many-requests') ? 'Muitas tentativas. Espere alguns minutos.'
        : c.includes('network') ? 'Sem conexão com a internet.' : 'Não foi possível entrar (' + c + ').';
      renderLogin(modo, msg);
    }
  };
}

function bindCor(b) {

/* ---------- Plantão ---------- */
function gerarDatas(base, rep) {
  if (!rep || rep.tipo === 'nao') return [base];
  if (rep.tipo === 'datas') return [...new Set(rep.datas)].sort();
  const out = [], limite = rep.ate || addD(base, 365), vezes = +rep.vezes || 0;
  const dias = rep.dias && rep.dias.length ? rep.dias : [dow(base)];
  const w0 = addD(base, -dow(base));
  for (let i = 0; i < 400; i++) {
    const d = addD(base, i);
    if (d > limite || (vezes && out.length >= vezes) || out.length >= 366) break;
    let ok = false;
    if (rep.tipo === 'diaria') ok = true;
    else if (rep.tipo === 'semanal') ok = dias.includes(dow(d));
    else if (rep.tipo === 'quinzenal') ok = dias.includes(dow(d)) && Math.floor(diffD(d, w0) / 7) % 2 === 0;
    else if (rep.tipo === 'ndias') ok = i % Math.max(1, +rep.n || 1) === 0;
    if (ok) out.push(d);
  }
  return out;
}

function achaRec(id) { return recebiveis().find(r => r.id === id); }
function formPagar(id) {

  const b = openSheet('Marcar como pago', `<form id="fpg">
    <div class="ln" style="--c:${l.cor};margin-bottom:12px"><span class="dot"></span><div class="g"><b>${esc(l.nome)}</b><span class="mono">${rotulo(r)}</span></div><div class="v">${money(total(r))}</div></div>

    <button class="btn p w" type="submit">${ic('ok')}Confirmar pagamento</button>
  </form>`);
  const f = b.querySelector('#fpg');
  f.onsubmit = async e => { e.preventDefault(); closeSheet(); await pagar([r], num(f.valor.value), f.data.value || HOJE); toast('Pagamento registrado', 'Desfazer', () => despagar([achaRec(r.id)])); };
}
async function pagar(lista, valorTotal, data) {
  const soma = lista.reduce((s, r) => s + total(r), 0);
  const fator = soma ? valorTotal / soma : 0;
  const ops = [], salPorLocal = {};
  lista.forEach((r, i) => {
    let vp = lista.length === 1 ? valorTotal : Math.round(total(r) * fator * 100) / 100;
    if (lista.length > 1 && i === lista.length - 1) vp = Math.round((valorTotal - ops.reduce((s, o) => s + (o.vp || 0), 0) - Object.values(salPorLocal).flat().reduce((s, x) => s + x.vp, 0)) * 100) / 100;
    if (r.sal) (salPorLocal[r.localId] ||= []).push({ ref: r.ref, vp });
    else { const p = S.plantoes.find(x => x.id === r.id); ops.push({ col:'plantoes', obj:{ ...p, pago:true, valorPago:vp, dataPago:data }, vp }); }
  });
  Object.entries(salPorLocal).forEach(([lid, xs]) => { const l = S.locais.find(x => x.id === lid); const pagos = { ...(l.pagos || {}) }; xs.forEach(x => pagos[x.ref] = { valor:x.vp, data }); ops.push({ col:'locais', obj:{ ...l, pagos } }); });
  await putMany(ops.map(({ col, obj }) => ({ col, obj })));
}
async function despagar(lista) {
  const ops = [], salPorLocal = {};
  lista.filter(Boolean).forEach(r => {
    if (r.sal) (salPorLocal[r.localId] ||= []).push(r.ref);
    else { const p = S.plantoes.find(x => x.id === r.id); ops.push({ col:'plantoes', obj:{ ...p, pago:false, valorPago:0, dataPago:'' } }); }
  });
  Object.entries(salPorLocal).forEach(([lid, refs]) => { const l = S.locais.find(x => x.id === lid); const pagos = { ...(l.pagos || {}) }; refs.forEach(k => delete pagos[k]); ops.push({ col:'locais', obj:{ ...l, pagos } }); });
  await putMany(ops);
}
function formPagarLocal(lid) {
  const l = loc(lid);
  const abertos = sortBy(recebiveis().filter(r => r.localId === lid && !r.pago && total(r) > 0), r => r.prev || r.data || '');
  if (!abertos.length) return toast('Nada em aberto neste local.');
  const sel = new Set(abertos.filter(r => !r.prev || r.prev <= HOJE).map(r => r.id));

  const b = openSheet(`Pagos · ${l.nome}`, `<form id="fpl">
    <div class="chips" style="margin-bottom:10px"><button type="button" class="chip" data-q="atr">Atrasados</button><button type="button" class="chip" data-q="hoje">Previstos até hoje</button><button type="button" class="chip" data-q="todos">Todos</button><button type="button" class="chip" data-q="nenhum">Nenhum</button></div>
    <div class="paylist">${abertos.map(r => `<label><input type="checkbox" value="${r.id}" ${sel.has(r.id) ? 'checked' : ''}><span><span class="mono">${rotulo(r)}</span><br><span class="muted">${r.prev ? (r.prev < HOJE ? '<span style="color:var(--ambar)">atrasado</span> · ' : '') + 'previsto ' + ddmm(r.prev) : 'sem data prevista'}</span></span><span class="mono">${money(total(r))}</span></label>`).join('')}</div>
    <div class="row"><label class="f"><span>Valor recebido</span><input class="in mono" name="valor" inputmode="decimal"></label><label class="f"><span>Data</span><input class="in" type="date" name="data" value="${HOJE}"></label></div>
    <div class="muted" data-info style="margin:-4px 0 12px"></div>

  const f = b.querySelector('#fpl'), cbs = [...b.querySelectorAll('.paylist input')];

    closeSheet(); await pagar(a, num(f.valor.value), f.data.value || HOJE);
    toast(`${a.length} marcado${a.length > 1 ? 's' : ''} como pago${a.length > 1 ? 's' : ''}`, 'Desfazer', () => despagar(a.map(r => achaRec(r.id))));
  };
}

const CSV_COLS = ['data','local','especialidade','dividido_com','sua_parte','inicio','fim','horas','valor','adicional','desc_adicional','pago','valor_pago','data_pago','pagamento_previsto','pagamento_solicitado','importante','observacao'];
function csvDe(ps) {

function baixar(nome, conteudo, tipo) {

    const c = txt[i];

    else if (c === sep) { row.push(cur); cur = ''; }

}

function dStart(e) {

    if (!u) { S.uid = null; Object.assign(S, { locais:[], modelos:[], plantoes:[], ferias:[], cfg:DEFCFG() }); return renderLogin(); }
    if (S.criando) return;
    entrar(u);
  });
})();
